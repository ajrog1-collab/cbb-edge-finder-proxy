services:
  - type: web
    name: cbb-edge-finder-proxy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker so the in-memory cache is shared; threads handle concurrent requests.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: CBBD_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
